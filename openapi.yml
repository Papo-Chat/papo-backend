            application/json:
              schema:
                $ref: '#/components/schemas/LinkPreviewWithImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /search:
    post:
      tags: [Search]
      summary: Busca com diversos parâmetros (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      description: |
        Os resultados são limitados a canais legíveis pelo usuário autenticado
        (dono do servidor, canais abertos sem permissões definidas ou canais
        em que uma das suas roles tem read_channel).
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (paginação por created_at)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último resultado da página anterior (cursor exato usado com since)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Resultados da busca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Termo de busca ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Lista os logs de auditoria (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      description: |
        Retorna os eventos auditáveis em ordem decrescente (mais recentes
        primeiro). Requer a permissão `manage_server` (dono do servidor ou role
        com a permissão). Os filtros opcionais podem ser combinados.
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: 'Filtra por ação (ex.: user.ban, message.delete, role.create)'
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtra por quem executou a ação
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
          description: Filtra por tipo de entidade (user, server, channel, message, attachment, role, user_role, emoji)
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (created_at >= since)
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (created_at <= until)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último log da página anterior (cursor exato usado com since)
      responses:
        '200':
          description: Logs de auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          description: Parâmetro inválido (since/until fora do formato ISO 8601)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket (handshake com o mesmo cookie Auth)
      description: |
        Endpoint WebSocket: `ws://localhost:8080/ws`. O JWT do cookie `Auth`
        é validado no handshake. Eventos (conforme README):
        | Event            | Direction | Payload                                                                           |
        | ---------        | --------- | ---------------------------------------------------------------------             |
        | `message`        | outbound  | `{ type: "message", id, channel_id, author_id, content, attachments, created_at }`         |
        | `message_edit`   | outbound  | `{ type: "message_edit", id, channel_id, content, edited_at }`                          |
        | `message_delete` | outbound  | `{ type: "message_delete", id, channel_id }`                                            |
        | `attachment_moderation_update` | outbound  | `{ type: "attachment_moderation_update", channel_id, message_id, attachment_id, status }` (status: sensitive; o blocked exclui a mensagem e chega como `message_delete`) |
        | `message_pin`    | outbound  | `{ type: "message_pin", message_id, is_pinned }` (is_pinned: true quando a mensagem foi pinada, false quando a fixação foi removida) |
        | `react_update`   | outbound  | `{ type: "react_update", message_id, emoji_id, unicode, count }` (emoji_id/unicode: um é null; count = usuários que reagiram com aquele emoji, 0 quando a última foi removida) |
        | `new_notification` | unicast  | `{ type: "new_notification", id, user_id, message_id, message_content }` (id: row de notificação ou UUID efêmero quando a configuração all gera evento sem row; user_id: autor da mensagem; message_content: truncado a 512 caracteres) |
        | `channel_create` | outbound  | `{ type: "channel_create", channel_id, name, channel_type, position }`                 |
        | `channel_update` | outbound  | `{ type: "channel_update", channel_id, name, position }`                               |
        | `channel_delete` | outbound  | `{ type: "channel_delete", channel_id }`                                               |
        | `typing`         | inbound   | `{ type: "typing", channel_id }`                                                        |
        | `typing`         | outbound  | `{ type: "typing", channel_id, user_id, is_typing }`                                    |
        | `avatar_update`  | outbound  | `{ type: "avatar_update", user_id }`                                                    |
        | `user_join`      | outbound  | `{ type: "user_join", user_id }`                                                        |
        | `presence_update`| outbound  | `{ type: "presence_update", user_id, status, status_message, nickname }` (status: online/offline/away/busy) |
        | `presence_sync  `| unicast   | `{ type: "presence_sync", members: (user_id, status, status_message, nickname)[] }` (status: online/offline/away/busy) |
        | `heartbeat`      | inbound   | `{ type: "heartbeat" }`                                                                 |
        | `heartbeat_ack`  | outbound  | `{ type: "heartbeat_ack" }`                                                             |
        | `error`          | outbound  | `{ type: "error", message, code? }`                                                     |
      responses:
        '101':
          description: WebSocket upgrade
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: Auth
      description: JWT em cookie HttpOnly (Path=/, Secure, SameSite=Strict)

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmojiId:
      name: emoji_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Autenticado, mas sem permissão
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Banned:
      description: IP/usuário banido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro interno do servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: Erro RFC 7807 (application/problem+json)
      required: [type, title, status]
      properties:
        type:
          type: string
          example: https://papo.com/errors/invalid-param
        title:
          type: string
          example: Parâmetro inválido
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Campo 'username' é obrigatório
        instance:
          type: string
          example: /auth/login

    GenericResponse:
      type: object
      properties:
        response:
          type: string
          example: User status updated successfully

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
        token:
          type: string
          description: JWT (também definido no cookie Auth)
        connection_violation:
          type: boolean
          description: Verdadeiro se houve detecção de reuso de token de sessão (todas as conexões foram revogadas)

    LoginServerRequest:
      type: object
      required: [server_password]
      properties:
        server_password:
          type: string

    LoginServerResponse:
      type: object
      properties:
        temp_token:
          type: string
          description: JWT temporário de 30min (também definido no cookie Auth)

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido do usuário (vale enquanto online)
        status_message:
          type: string
          nullable: true
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
          nullable: true
        avatar_blob:
          type: string
          format: byte
          description: Avatar em base64
        avatar_format:
          type: string
          example: PNG
        banner_media:
          type: string
          nullable: true
          description: Referência (sha256) do banner na mídia content-addressable; o arquivo é baixado via GET /media/{sha_hash}
        description:
          type: string
          nullable: true
          maxLength: 512
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido do usuário (vale enquanto online)
        status_message:
          type: string
          nullable: true
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ProfileBatchRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid

    WhoamiResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
          nullable: true
        avatar_blob:
          type: string
          format: byte
          description: Avatar em base64
        avatar_format:
          type: string
          example: PNG
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido do usuário (vale enquanto online)
        status_message:
          type: string
          nullable: true
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        settings:
          type: object
          properties:
            version:
              type: integer
            config:
              $ref: '#/components/schemas/UserConfig'
        connection_violation:
          type: boolean
          description: Verdadeiro se houve detecção de reuso de token de sessão (todas as conexões foram revogadas)

    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Expiração do JWT desta conexão (token_issued_at + 24h)

    RefreshResponse:
      type: object
      properties:
        token:
          type: string
          description: Novo JWT (também definido no cookie Auth)
        connection:
          $ref: '#/components/schemas/Connection'

    ConnectedDevicesResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'

    DropConnectionRequest:
      type: object
      required: [connection_id]
      properties:
        connection_id:
          type: string
          description: UUID da conexão a revogar, ou "ALL" para revogar todas

    DropConnectionResponse:
      type: object
      properties:
        dropped:
          type: integer
          description: Número de conexões revogadas

    UserSettings:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        version:
          type: integer
        config:
          $ref: '#/components/schemas/UserConfig'
        updated_at:
          type: string
          format: date-time

    UserConfig:
      type: object
      properties:
        theme:
          type: string
          enum: [dark, light, system]
        notifications:
          $ref: '#/components/schemas/Notifications'
        display:
          $ref: '#/components/schemas/Display'

    Notifications:
      type: object
      properties:
        enabled:
          type: boolean
        messagePreview:
          type: boolean
        sound:
          type: boolean
        mentions:
          type: boolean

    Display:
      type: object
      properties:
        fontSize:
          type: string
          enum: [small, medium, huge]
        messageDensity:
          type: string
          enum: [compact, normal, comfortable]
        showTimestamps:
          type: boolean
        showAvatars:
          type: boolean

    UpdateUserRequest:
      type: object
      required: [nickname, status, description]
      properties:
        nickname:
          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 512

    UpdateAvatarRequest:
      type: object
      required: [avatar, avatar_format]
      properties:
        avatar:
          type: string
          description: Base64 de GIF, JPEG ou PNG (máx. 2MB)
        avatar_format:
          type: string
          enum: [GIF, JPEG, PNG]

    UpdateBannerRequest:
      type: object
      required: [banner, banner_format]
      properties:
        banner:
          type: string
          description: Base64 de GIF, JPEG ou PNG (máx. 2MB); vazio remove o banner
        banner_format:
          type: string
          enum: [GIF, JPEG, PNG]
          description: Vazio remove o banner

    UpdateStatusRequest:
      type: object
      properties:
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido (away/busy); null remove o status

    ChangePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Nova senha do usuário

    BanUserRequest:
      type: object
      required: [ban_state]
      properties:
        user_id:
          type: string
          format: uuid
          description: ID do usuário (o id da URL é o autoritativo)
        ban_state:
          type: boolean
          description: true para banir, false para desbanir

    UpdateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        icon_blob:
          type: string
          format: byte
          description: Ícone em base64 (GIF/JPEG/PNG, máx. 2MB); vazio remove o ícone
        icon_format:
          type: string
          enum: [GIF, JPEG, PNG]
        password:
          type: string
          description: Senha do servidor; obrigatória quando o servidor ficar privado (public=false)
        public:
          type: boolean
          description: Servidor público; ausente mantém a visibilidade atual

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        icon_blob:
          type: string
          format: byte
          description: Ícone em base64 (GIF/JPEG/PNG, máx. 2MB)
        icon_format:
          type: string
          enum: [GIF, JPEG, PNG]
        password:
          type: string
          description: Senha do servidor; obrigatória quando public=false
        public:
          type: boolean
          description: Servidor público; ausente significa público (default do schema)

    CreateServerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon_blob:
          type: string
          format: byte
        icon_format:
          type: string
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string
        created_at:
          type: string
          format: date-time

    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon_blob:
          type: string
          format: byte
          description: Ícone em base64
        icon_format:
          type: string
          example: PNG
        owner_id:
          type: string
          format: uuid
        public:
          type: boolean
          description: Servidor público
        owner_username:
          type: string
        created_at:
          type: string
          format: date-time
        channel_count:
          type: integer
        member_count:
          type: integer
        role_count:
          type: integer

    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [text, category]
        position:
          type: integer
          description: Posição do canal na visualização (1-based)
        topic:
          type: string
          nullable: true
          description: >
            Tópico do canal (máx 512 caracteres). Válido apenas para canais de
            texto; null para canais category ou sem tópico.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ChannelPermissionEntry'
        created_at:
          type: string
          format: date-time
        last_message:
          $ref: '#/components/schemas/Message'
        last_read_message:
          type: string
          format: uuid
          nullable: true
          description: >
            Última mensagem lida pelo usuário autenticado neste canal
            (user_channel_state). Null quando o usuário ainda não leu o canal.
        last_read_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Momento em que o usuário autenticado leu até last_read_message.
            Null quando o usuário ainda não leu o canal.
        notification_settings:
          $ref: '#/components/schemas/NotificationSettings'
    NotificationSettings:
      type: string
      enum: [off, only_mentions, all]
      description: >
       Configuração de notificação do usuário autenticado neste canal (channel_user_settings). Ausência de row equivale ao padrão only_mentions.
        off: nenhuma notificação; only_mentions: notifica apenas quando o
        usuário é mencionado diretamente, é o autor da mensagem respondida
        (reply_to) ou o canal recebe @everyone; all: notifica toda mensagem
        do canal.
        

    ChannelUserSetting:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        notification_settings:
          $ref: '#/components/schemas/NotificationSettings'
        updated_at:
          type: string
          format: date-time

    UpdateChannelUserSettingRequest:
      type: object
      required: [notification_settings]
      properties:
        notification_settings:
          $ref: '#/components/schemas/NotificationSettings'

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
          nullable: true
          description: Autor da mensagem notificada (null quando o autor foi removido)
        message_content:
          type: string
          description: Conteúdo da mensagem notificada, truncado a 512 caracteres
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        has_more:
          type: boolean

    MarkNotificationsReadRequest:
      type: object
      required: [notification_ids]
      properties:
        notification_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid

    MarkNotificationsReadResponse:
      type: object
      properties:
        updated:
          type: integer
          description: Número de notificações marcadas como lidas

    ChannelPermissionEntry:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        permissions:
          $ref: '#/components/schemas/ChannelPermissions'

    ChannelPermissions:
      type: object
      properties:
        read_channel:
          type: boolean
        send_messages:
          type: boolean
        delete_messages:
          type: boolean

    ChannelPermissionsResponse:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ChannelPermissionEntry'

    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, category]
          description: Tipo do canal (padrão text)
        topic:
          type: string
          description: >
            Tópico do canal (máx 512 caracteres). Opcional; válido apenas para
            canais de texto.

    UpdateChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        topic:
          type: string
          nullable: true
          description: >
            Tópico do canal (máx 512 caracteres). Opcional; ausente não altera
            o tópico, string vazia limpa o tópico. Válido apenas para canais de
            texto.

    ChangeChannelPositionRequest:
      type: object
      required: [old_position, new_position]
      properties:
        old_position:
          type: integer
        new_position:
          type: integer

    UpdateChannelPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          $ref: '#/components/schemas/ChannelPermissions'

    Message:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
        reply_to:
          type: string
          format: uuid
          nullable: true
          description: >
            Id da mensagem respondida (sempre do mesmo canal). Null quando a
            mensagem não é uma resposta. Sem FK: pode apontar para uma mensagem
            já excluída (o cliente exibe "mensagem não disponível").
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: >
            O schema (attachments.messages_id) permite múltiplos attachments
            por mensagem.
        previews:
          type: array
          items:
            $ref: '#/components/schemas/LinkPreview'
          description: >
            Link previews (OpenGraph/oEmbed) extraídos do content da mensagem
            (best-effort; vazio quando não há URL ou a extração falhou).
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/MessageReactionSummary'
          description: >
            Contagem de tipos de reação da mensagem (sem a lista de usuários;
            use GET /channels/{channel_id}/messages/{message_id}/reactions).
            Null quando a mensagem não tem reações.

    PinnedMessage:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        pinned_by:
          type: string
          format: uuid
          nullable: true
          description: >
            Usuário que fixou a mensagem. Null quando o usuário foi excluído.
        pinned_at:
          type: string
          format: date-time

    PinnedMessageList:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        pinned:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: >
            Mensagens pinadas do canal, na ordem em que foram fixadas
            (pinned_at crescente). Vazio quando o canal não tem mensagens
            pinadas.

    MessageListResponse:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean

    ReactionRequest:
      type: object
      properties:
        emoji_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Id de um emoji custom do banco. Exatamente um de emoji_id ou
            unicode deve ser informado.
        unicode:
          type: string
          nullable: true
          description: >
            Emoji unicode (máx 16 caracteres). Exatamente um de emoji_id ou
            unicode deve ser informado.

    MessageReaction:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        emoji_id:
          type: string
          format: uuid
          nullable: true
          description: Emoji custom do banco (null para emoji unicode)
        unicode:
          type: string
          nullable: true
          description: Emoji unicode (null para emoji custom)
        created_at:
          type: string
          format: date-time

    MessageReactionSummary:
      type: object
      properties:
        emoji_id:
          type: string
          format: uuid
          nullable: true
          description: Emoji custom do banco (null para emoji unicode)
        unicode:
          type: string
          nullable: true
          description: Emoji unicode (null para emoji custom)
        count:
          type: integer
          description: Número de usuários que reagiram com este emoji

    MessageReactionGroup:
      type: object
      properties:
        emoji_id:
          type: string
          format: uuid
          nullable: true
          description: Emoji custom do banco (null para emoji unicode)
        unicode:
          type: string
          nullable: true
          description: Emoji unicode (null para emoji custom)
        count:
          type: integer
          description: Número de usuários que reagiram com este emoji
        users:
          type: array
          items:
            type: string
            format: uuid
          description: Usuários que reagiram com este emoji

    MessageReactionList:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/MessageReactionGroup'

    CreateMessageRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: string
          format: uuid
        content:
          type: string
        reply_to:
          type: string
          format: uuid
          description: >
            Opcional. Id da mensagem respondida; deve existir e estar no mesmo
            canal.
        attachments:
          type: array
          items:
            type: string
            format: binary

    UpdateMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    Attachment:
      type: object
      description: >
        Informação mínima do attachment exposta nas respostas de mensagens
        (listagem, criação e edição).
      properties:
        id:
          type: string
          format: uuid
        mime_type:
          type: string
        original_file_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        thumbnail_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ID da thumbnail gerada no upload (imagens jpeg/png/webp/gif);
            null quando não há thumbnail. Download em
            /attachments/{file_id}/thumbnail.
        created_at:
          type: string
          format: date-time
        moderation_status:
          type: string
          description: >
            Estado da moderação assíncrona de imagens (nudez/gore):
            pending/processing/clean/sensitive/blocked/failed
            (pending quando a moderação está desativada).

    LinkPreview:
      type: object
      description: >
        Preview de link (OpenGraph ou oEmbed) em cache por URL normalizada.
        kind: 'og' (OpenGraph) ou 'oembed' (provedor allowlistado).
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: URL normalizada (chave do cache)
        kind:
          type: string
          enum: [og, oembed]
        title:
          type: string
          nullable: true
          description: Título (máx. 200 chars, truncado)
        description:
          type: string
          nullable: true
          description: Descrição (máx. 300 chars, truncada)
        provider_name:
          type: string
          nullable: true
          description: Nome do provedor (oEmbed)
        embed_url:
          type: string
          nullable: true
          description: >
            Embed de vídeo derivado de padrão hardcoded (MVP: apenas
            YouTube, formato https://www.youtube.com/embed/<id>). O frontend
            deve renderizar iframe somente se casar exatamente com esse
            padrão.
        image_mime_type:
          type: string
          nullable: true
          description: MIME da thumbnail da imagem do preview (webp/gif)
        image_size_bytes:
          type: integer
          format: int64
          nullable: true
        fetched_at:
          type: string
          format: date-time

    LinkPreviewWithImage:
      description: >
        LinkPreview + imagem embutida em base64 (resposta de
        GET /link-previews/{preview_id}).
      allOf:
        - $ref: '#/components/schemas/LinkPreview'
        - type: object
          properties:
            image_data:
              type: string
              format: byte
              nullable: true
              description: Imagem do preview em base64 (null quando não há imagem)

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
          example: '#FF0000'
        permissions:
          $ref: '#/components/schemas/RolePermissions'
        created_at:
          type: string
          format: date-time

    RolePermissions:
      type: object
      properties:
        manage_server:
          type: boolean
        manage_channels:
          type: boolean
        manage_roles:
          type: boolean
        ban_members:
          type: boolean
        pin_message:
          type: boolean
        everyone_message:
          type: boolean
        send_attachment:
          type: boolean

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        permissions:
          $ref: '#/components/schemas/RolePermissions'

    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        permissions:
          $ref: '#/components/schemas/RolePermissions'

    UserRole:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time

    AssignRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid

    Emoji:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
          enum: [GIF, JPEG, PNG]
        image_blob:
          type: string
          format: byte
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CreateEmojiRequest:
      type: object
      required: [name, image_blob, format]
      properties:
        name:
          type: string
        image_blob:
          type: string
          format: byte
        format:
          type: string
          enum: [GIF, JPEG, PNG]

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        has_more:
          type: boolean
          description: Indica se existe próxima página (cursor since + last_id)

    SearchRequest:
      type: object
      description: Pelo menos 1 campo obrigatório; os filtros podem ser combinados
      properties:
        text:
          type: string
          description: Termo de busca
        author:
          type: string
          format: uuid
          description: Filtro por autor da mensagem
        order:
          type: string
          enum: [asc, desc]
          description: Ordem dos resultados por data
        date_start:
          type: string
          format: date
          description: Data inicial do filtro (inclusive)
        date_end:
          type: string
          format: date
          description: Data final do filtro (inclusive)
        contains_attachment:
          type: boolean
          description: Filtra mensagens com attachment

    SearchResult:
      type: object
      properties:
        type:
          type: string
          example: message
        id:
          type: string
          format: uuid
        content:
          type: string
        channel_id:
          type: string
          format: uuid
        channel_name:
          type: string
        author_id:
          type: string
          format: uuid
        author_username:
          type: string
        created_at:
          type: string
          format: date-time
        score:
          type: number
          format: double

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_username:
          type: string
          description: Snapshot do username do ator no momento da operação
        action:
          type: string
          description: 'Ação auditável (ex.: user.ban, message.delete, role.create)'
        entity_type:
          type: string
          description: Tipo da entidade afetada (user, server, channel, message, attachment, role, user_role, emoji)
        target_user_id:
          type: string
          format: uuid
          nullable: true
          description: Usuário alvo da ação, quando difere do ator
        metadata:
          type: object
          additionalProperties: true
          description: Dados específicos da ação
        created_at:
          type: string
          format: date-time

    AuditLogList:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        has_more:
          type: boolean
          description: Indica se existe próxima página (cursor since + last_id)