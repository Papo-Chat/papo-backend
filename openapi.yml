openapi: 3.0.3
info:
  title: Papo API
  description: |
    API do Papo — chat self-hosted (Go + Echo + PostgreSQL + WebSockets).

    Convenções:
    - Autenticação via cookie HttpOnly `Auth` (JWT).
    - Erros seguem RFC 7807 (`application/problem+json`) e toda resposta
      inclui o header `X-Request-ID`.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Backend local
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Servers
  - name: Channels
  - name: Messages
  - name: Notifications
  - name: Roles
  - name: UserRoles
  - name: Emojis
  - name: Attachments
  - name: Media
  - name: LinkPreviews
  - name: Search
  - name: Admin
  - name: WebSocket

security:
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Servidor no ar
          content:
            text/plain:
              example: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Cria novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Servidor não público sem autorização temporária (execute /auth/login_server antes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Banned'
        '409':
          description: Username já existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Faz login e define o cookie Auth (HttpOnly)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Login bem-sucedido (Set-Cookie: Auth=jwt)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais inválidas ou servidor não público sem autorização temporária (execute /auth/login_server antes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Banned'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login_server:
    post:
      tags: [Auth]
      summary: Valida a senha do servidor e define o cookie Auth com token temporário (30min)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginServerRequest'
      responses:
        '200':
          description: "Senha válida (Set-Cookie: Auth=temp_token; Max-Age=1800)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginServerResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Senha do servidor incorreta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/whoami:
    get:
      tags: [Auth]
      summary: Retorna o usuário autenticado com settings
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Faz logout (revoga a conexão de sessão no banco e remove o cookie Auth)
      security: []
      responses:
        '204':
          description: Logout bem-sucedido (Set-Cookie expira o Auth)

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona o token de sessão (novo JWT + Set-Cookie) e retorna a conexão atual
      responses:
        '200':
          description: "Sessão rotacionada (Set-Cookie: Auth=novo_jwt)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/connected_devices:
    get:
      tags: [Auth]
      summary: Lista as conexões de sessão ativas do usuário
      responses:
        '200':
          description: Conexões ativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedDevicesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/drop_connection:
    post:
      tags: [Auth]
      summary: Revoga uma conexão de sessão (id específico ou ALL para todas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropConnectionRequest'
      responses:
        '200':
          description: Conexão(ões) revogada(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropConnectionResponse'
        '400':
          description: connection_id ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/profile:
    get:
      tags: [Users]
      summary: Perfil do usuário (com avatar); qualquer usuário autenticado pode consultar
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/profile_batch:
    post:
      tags: [Users]
      summary: Perfis em lote (mesma forma do profile; máx. 50 ids; ids inexistentes são pulados)
      description: |
        Retorna os perfis dos usuários solicitados, na ordem da requisição,
        pulando ids que não existem. Ids duplicados são considerados uma única
        vez. Máximo de 50 ids por requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileBatchRequest'
      responses:
        '200':
          description: Perfis dos usuários encontrados (na ordem da requisição)
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
        '400':
          description: Campo ausente ou inválido (ids ausente/vazio, id vazio ou mais de 50 ids)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Users]
      summary: Lista usuários (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (polling de novos usuários)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último usuário da página anterior (cursor exato usado com since)
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  has_more:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/settings:
    put:
      tags: [Users]
      summary: Atualiza as configurações do usuário autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: '#/components/schemas/UserConfig'
      responses:
        '200':
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}:
    put:
      tags: [Users]
      summary: Atualiza nickname, status e description (somente o próprio usuário)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/avatar:
    put:
      tags: [Users]
      summary: Atualiza o avatar (base64, GIF/JPEG/PNG, máx. 2MB)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvatarRequest'
      responses:
        '200':
          description: Avatar atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Avatar inválido (base64 de GIF/JPEG/PNG até 2MB)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/banner:
    put:
      tags: [Users]
      summary: Atualiza o banner (base64, GIF/JPEG/PNG, máx. 2MB); corpo vazio remove o banner
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerRequest'
      responses:
        '200':
          description: Banner atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Banner inválido (base64 de GIF/JPEG/PNG até 2MB)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/status:
    put:
      tags: [Users]
      summary: Atualiza o status persistido (away/busy; null remove)
      description: >
        O status vale enquanto o usuário estiver online (disponibilizado via
        presence_update/presence_sync); offline, o status persistido vale na
        próxima conexão.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Status inválido (deve ser away, busy ou null)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/password:
    put:
      tags: [Users]
      summary: Altera a própria senha e reinicia a flag de reset de senha
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/ban:
    put:
      tags: [Users]
      summary: Bane ou desbane um usuário (banimento global)
      description: "Permission Check: dono de um servidor ou `manage_server`"
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BanUserRequest'
      responses:
        '200':
          description: Estado de banimento alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/reset:
    post:
      tags: [Users]
      summary: Marca o usuário para redefinir a senha
      description: "Permission Check: dono de um servidor ou o próprio usuário"
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Flag de reset de senha definida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/roles:
    post:
      tags: [UserRoles]
      summary: Atribui role a um usuário
      description: "Permission Check: `manage_roles`"
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Role atribuída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRole'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/roles/{role_id}:
    delete:
      tags: [UserRoles]
      summary: Remove role de um usuário
      description: "Permission Check: `manage_roles`"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Role removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/notifications:
    get:
      tags: [Notifications]
      summary: Lista as notificações do usuário em ordem decrescente (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      description: "Permission Check: somente o próprio usuário (user_id autenticado)"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: since
          in: query
          required: false
          description: Timestamp ISO 8601 para polling de novas notificações
          schema:
            type: string
            format: date-time
        - name: last_id
          in: query
          required: false
          description: Id da última notificação da página anterior; usado com since como cursor exato (created_at, id)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notificações do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/read_notification:
    put:
      tags: [Notifications]
      summary: Marca notificações do usuário como lidas (1 a 1000 ids)
      description: "Permission Check: somente o próprio usuário (user_id autenticado)"
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        '200':
          description: Notificações marcadas como lidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationsReadResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /server:
    get:
      tags: [Servers]
      summary: Detalhes do servidor
      security: []
      responses:
        '200':
          description: Detalhes do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Servers]
      summary: Cria o servidor
      description: "Permission Check: Table Servers have no registry (somente 1 servidor)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '200':
          description: Servidor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServerResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: O servidor já foi criado (máximo de 1)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Servers]
      summary: Altera o servidor (nome, ícone, senha e visibilidade)
      description: "Permission Check: dono do servidor ou `manage_server`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Servidor atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles:
    get:
      tags: [Roles]
      summary: Lista roles
      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Roles]
      summary: Cria role
      description: "Permission Check: `manage_roles`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Nome de role já existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles/{role_id}:
    put:
      tags: [Roles]
      summary: Atualiza role
      description: "Permission Check: `manage_roles`"
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
         '200':
           description: Role atualizada
           content:
